name: Generate THU Schedule ICS

on:
  schedule:
    # 北京时间每天 04:00（= UTC 20:00）：每日基线刷新
    - cron: "0 20 * * *"
    # 每小时：仅当开启 THU_INTENSIVE 变量（选课期间）时实际抓取
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to run
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            RUN="true"   # 手动触发总是执行
          elif [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            RUN="true"   # 每日基线
          elif [ "${{ vars.THU_INTENSIVE }}" = "1" ]; then
            RUN="true"   # 选课期间每小时
          else
            RUN="false"  # 每小时触发但未开启密集模式 → 跳过
          fi
          echo "run decision: $RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: thu-ics
        run: npm install

      - name: Generate ICS
        if: steps.gate.outputs.run == 'true'
        working-directory: thu-ics
        env:
          THU_USER_ID: ${{ secrets.THU_USER_ID }}
          THU_PASSWORD: ${{ secrets.THU_PASSWORD }}
          THU_TOTP_SECRET: ${{ secrets.THU_TOTP_SECRET }}
          THU_SEMESTER_INDEX: ${{ vars.THU_SEMESTER_INDEX }}
        run: npm run generate

      - name: Commit and push
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add res/courses.ics
          if git diff --cached --quiet; then
            echo "ICS 无变化，跳过提交。"
          else
            git commit -m "chore: update res/courses.ics"
            git push
          fi
